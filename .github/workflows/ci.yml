name: ci

# saas-identity-platform-react (React 19 + Vite SPA)
# 推送链:
# - branch push(master/main)→ 只跑 test(对齐门禁 L1-L4)
# - tag push(v<X>.<Y>.<Z>-<YYYYMMDD> per tag.md §1)  → test + docker build & push + VPS 部署
# 镜像名/SSH 路径/部署脚本用 ${{ github.event.repository.name }} 避免跨仓劫持。
on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # msw 剔除 Phase 2：单测真化（Task 10）——jsdom dom 测试经 tests/global-setup.ts
    # 起真 saas-nextjs :5101（对齐 lab-react T7–T9），需要 ephemeral PG（服务容器，
    # 凭据随容器销毁，非真实 secret）。scratch DB = saas_p2_test（不碰 saas_dev/saas_test）。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_p2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 真化基座用 DB（migrate + seed + nextjs dev 同一连接串，job 级注入全局生效）
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas_p2_test
      # JWT 铸造/验签（tests/global-setup.ts 铸 + nextjs src/lib/jwt.ts 验）：
      # CI 域自洽值（>=32 bytes），只在本 job 的 globalSetup 与 nextjs 进程间保持
      # 一致，非部署 secret；改走 GitHub secrets 时换 ${{ secrets.JWT_SIGNING_KEY }}
      # 即可（缺配置会 fail-fast 而非静默兜底）。
      JWT_SIGNING_KEY: ci-saas-jwt-secret-phase2-0123456789abcdef
      JWT_ISSUER: saas-identity-platform
      JWT_AUDIENCE: saas-identity-platform-clients
      # JWT_TTL_SECONDS: ADR-0019(commit 6c79c46 2026-09-04) 起必填,nextjs
      # src/lib/jwt.ts readTtlSeconds 缺即 throw → signToken 抛 → /api/v1/auth/login
      # 返 500 → saas-react 真链路 L4 测试 9/10/11 (login→/tenants 跳 + OAuth code 回跳
      # + 无 OAuth 参数) 全挂。tests 4/5 (仅断 spy 调用) 不需要响应故幸免。
      JWT_TTL_SECONDS: "3600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: https://registry.npmmirror.com/
      - name: Checkout shared sibling
        run: git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/saas-identity-platform-shared.git ../saas-identity-platform-shared
      # msw sibling 已随 Phase 2 移除：本仓与 nextjs sibling 均无 file: 依赖 msw 仓
      - name: Checkout nextjs sibling
        run: git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/saas-identity-platform-nextjs.git ../saas-identity-platform-nextjs
      - name: Install nextjs sibling dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ../saas-identity-platform-nextjs
      - name: gen:shared (nextjs sibling)
        run: npm run gen:shared
        working-directory: ../saas-identity-platform-nextjs
      - name: Install dependencies
        run: npm ci
      - name: gen:shared
        run: npm run gen:shared
      # 真化基座前置：schema 迁移 + 种子灌库（TRUNCATE 全量重播幂等，对 saas_p2_test）。
      # seed-db.mjs require pg（dependencies），migrate-db.mjs 走 drizzle-kit
      # （devDependencies）——不能 --omit=dev，这里必须全量装。
      - name: Install shared sibling dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ../saas-identity-platform-shared
      # drizzle.config.ts 强制读 PG_* 五件套（即便 DATABASE_URL 已设）——显式注入
      - name: Migrate DB
        run: node scripts/migrate-db.mjs
        working-directory: ../saas-identity-platform-shared
        env:
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: saas_p2_test
      - name: Seed DB
        run: node scripts/seed-db.mjs
        working-directory: ../saas-identity-platform-shared
      # global-setup 会复用已健康服务：CI 里没有现成的，这里先拉起并探活，
      # 失败时倒日志便于排障
      - name: Start nextjs :5101
        working-directory: ../saas-identity-platform-nextjs
        run: |
          nohup npm run dev > /tmp/nextjs-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5101/api/health | grep -q '"status":"ok"'; then
              echo "nextjs :5101 healthy"; exit 0
            fi
            sleep 2
          done
          echo "nextjs :5101 探活超时"; tail -50 /tmp/nextjs-dev.log; exit 1
      - name: Build
        run: npm run build
      - name: L1 format
        run: npx --no prettier --check src tests
      - name: L2 lint
        run: npx --no eslint src tests
      - name: L3 typecheck
        run: npx --no tsc --noEmit
      - name: L4 test
        run: npx --no vitest run

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 每次都重拉 deploy 脚本
            # （避免 v0.3.17 → v0.3.18 修了 deploy 脚本但 VPS 还跑着旧版的坑：
            #   原先 \`if [ ! -f ]\` 只在文件不存在时下载, 之后再也不更新 → CI deploy
            #   永远用旧逻辑。改成无条件 curl 重拉, 脚本若未变也不会触发其它副作用）
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/${REPO}.sh" -o "$REPO.sh"
            chmod +x "$REPO.sh"
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"
